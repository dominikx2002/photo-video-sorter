name: Build installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller main.spec --noconfirm

      # ---------------- Windows ----------------
      - name: Package Windows portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\PhotoVideoSorter\* -DestinationPath PhotoVideoSorter-Windows-portable.zip

      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: packaging/windows/installer.iss
          options: /DMyAppVersion=${{ github.ref_name }}

      - name: Upload Windows portable artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: PhotoVideoSorter-Windows-portable
          path: PhotoVideoSorter-Windows-portable.zip

      - name: Upload Windows installer artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: PhotoVideoSorter-Windows-Setup
          path: installer_output/PhotoVideoSorter-Setup.exe

      # ---------------- Linux ----------------
      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: |
          mkdir -p AppDir/usr/bin
          cp -r dist/PhotoVideoSorter/* AppDir/usr/bin/

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/PhotoVideoSorter" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat > AppDir/photovideosorter.desktop <<EOF
          [Desktop Entry]
          Name=Photo & Video Sorter
          Exec=PhotoVideoSorter
          Icon=photovideosorter
          Type=Application
          Categories=Utility;
          EOF

          python3 -c "from PIL import Image; Image.new('RGB', (256, 256), '#D97757').save('AppDir/photovideosorter.png')"
          cp AppDir/photovideosorter.png AppDir/.DirIcon

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir PhotoVideoSorter-Linux-x86_64.AppImage

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: PhotoVideoSorter-Linux
          path: PhotoVideoSorter-Linux-x86_64.AppImage

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # python.org's macOS installer is a universal2 (fat) binary containing
      # both arm64 and x86_64 slices - one install serves both legs of this
      # matrix. This sidesteps GitHub's separate Intel-Mac runner pool
      # (macos-13), which has very limited capacity now that GitHub is
      # winding down Intel hardware, and can queue for a long time or never
      # get picked up at all. Running the x86_64 leg via `arch -x86_64`
      # emulates Intel through Rosetta 2 (preinstalled on macos-14 runners),
      # and pip automatically resolves architecture-specific wheels (e.g.
      # Pillow, which has no universal2 wheel) based on which slice is
      # actually running.
      - name: Install universal2 Python
        run: |
          curl -fsSL -o python.pkg https://www.python.org/ftp/python/3.11.9/python-3.11.9-macos11.pkg
          sudo installer -pkg python.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.11/bin" >> "$GITHUB_PATH"

      - name: Install Rosetta 2 (for the x86_64 leg)
        if: matrix.arch == 'x86_64'
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Pick architecture-appropriate python command
        run: |
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            echo "PYTHON=arch -x86_64 python3" >> "$GITHUB_ENV"
          else
            echo "PYTHON=python3" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: |
          $PYTHON -m pip install --upgrade pip
          $PYTHON -m pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: $PYTHON -m PyInstaller main.spec --noconfirm

      - name: Verify built binary architecture
        run: file "dist/Photo & Video Sorter.app/Contents/MacOS/PhotoVideoSorter"

      - name: Package macOS .app
        run: |
          cd dist
          zip -r -y "../PhotoVideoSorter-macOS-${{ matrix.arch }}.zip" "Photo & Video Sorter.app"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoVideoSorter-macOS-${{ matrix.arch }}
          path: PhotoVideoSorter-macOS-${{ matrix.arch }}.zip

  release:
    needs: [build, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/PhotoVideoSorter-macOS-*/PhotoVideoSorter-macOS-*.zip
            artifacts/PhotoVideoSorter-Windows-portable/PhotoVideoSorter-Windows-portable.zip
            artifacts/PhotoVideoSorter-Windows-Setup/PhotoVideoSorter-Setup.exe
            artifacts/PhotoVideoSorter-Linux/PhotoVideoSorter-Linux-x86_64.AppImage
